apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: company-website
  template:
    metadata:
      labels:
        app: company-website
        git.commit: ${GIT_COMMIT}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ${DEPLOY_IMAGE}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 7000
          env:
            - name: FLASK_DEBUG
              value: "false"
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: company-website-secrets
                  key: secret-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: company-website-data
        - name: tmp
          emptyDir: {}
