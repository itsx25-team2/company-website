name: Deploy to K3s

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      # --- Build & push to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v2.6.4

      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      - name: Sign image with Cosign
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"

      # --- Network connectivity to K3s node ---
      - name: Generate Ephemeral Headscale Key
        id: generate_key
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          HEADSCALE_USER_ID: ${{ vars.HEADSCALE_USER_ID }}
        run: |
          EXPIRATION=$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          REQUEST=$(jq -n \
            --argjson user "$HEADSCALE_USER_ID" \
            --arg expiration "$EXPIRATION" \
            '{user: $user, ephemeral: true, reusable: false, expiration: $expiration, aclTags: ["tag:github-runner"]}')

          RESPONSE=$(curl -s -f -X POST "$HEADSCALE_URL/api/v1/preauthkey" \
            -H "Authorization: Bearer $HEADSCALE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST")

          EPHEMERAL_KEY=$(echo "$RESPONSE" | jq -r '.preAuthKey.key')

          if [ -z "$EPHEMERAL_KEY" ] || [ "$EPHEMERAL_KEY" == "null" ]; then
            echo "Error: Failed to retrieve key from Headscale API"
            exit 1
          fi

          echo "::add-mask::$EPHEMERAL_KEY"
          echo "key=$EPHEMERAL_KEY" >> $GITHUB_OUTPUT

      - name: Connect to Headscale Mesh
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ steps.generate_key.outputs.key }}
          args: --login-server=${{ secrets.HEADSCALE_URL }}
          version: 1.102.4

      - name: Verify connectivity to K3s node
        run: |
          K3S_HOST="10.0.${{ vars.TEAM_ID }}.3"

          for attempt in {1..12}; do
            if ip route get "$K3S_HOST" | grep -q tailscale0 && \
               timeout 3 bash -c "</dev/tcp/$K3S_HOST/6443"; then
              echo "Tailscale route and K3s API connectivity confirmed"
              exit 0
            fi

            echo "Waiting for the Headscale subnet route (attempt $attempt/12)"
            sleep 5
          done

          echo "Error: K3s API did not become reachable through Tailscale"
          ip route get "$K3S_HOST" || true
          tailscale status || true
          exit 1

      # --- Configure kubectl for remote k3s ---
      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get pods -n default

      # --- Deploy to K3s ---
      - name: Apply manifests and update image
        run: |
          export DEPLOY_IMAGE="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          export GIT_COMMIT="${{ github.sha }}"
          envsubst < k8s/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml -f k8s/pvc.yaml -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl rollout status deployment/company-website --timeout=120s
